name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 defaults to `packages: 'tools platform-tools'`, but the `tools`
          # package was removed from the Android SDK, so `sdkmanager tools`
          # fails with "Failed to find package 'tools'". Empty string skips it.
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4

      - name: Export Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android
