name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  # Lets you build a downloadable APK on demand from the Actions tab.
  workflow_dispatch:

# A newer push/PR supersedes an in-flight run on the same ref.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    # Pin the runner image explicitly: the `ubuntu-latest` label migrates to
    # Ubuntu 26.04 beginning 2026-10-19 (see actions/runner-images#14748), and
    # the Android NDK/SDK toolchain here is validated against 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 defaults to `packages: 'tools platform-tools'`, but the `tools`
          # package was removed from the Android SDK, so `sdkmanager tools`
          # fails with "Failed to find package 'tools'". Empty string skips it.
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo
        # v5 runs on the Node.js 24 runtime; v4 still targets the deprecated
        # Node.js 20 runtime.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      - name: Install cargo-ndk
        # ~/.cargo/bin is part of the Cargo cache, so a warm cache already ships
        # the pinned binary and a bare `cargo install` fails with "already
        # exists in destination". Skip when the right version is present and
        # force-reinstall otherwise.
        run: |
          if ! cargo-ndk --version 2>/dev/null | grep -q '3\.5\.4'; then
            cargo install cargo-ndk --version 3.5.4 --force
          fi

      - name: Export Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: android

      # Upload before the tests so the installable APK is always available for
      # real-device testing, even if a unit test later fails.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: numera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: android
