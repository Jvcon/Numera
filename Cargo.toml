[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/format",
    "crates/sync",
    "crates/crypto",
    "crates/command",
    "crates/wasm",
    "crates/ffi",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/user/numera"

[workspace.dependencies]
# 内部 crates
numera-engine = { path = "crates/engine" }
numera-format = { path = "crates/format" }
numera-sync = { path = "crates/sync" }
numera-crypto = { path = "crates/crypto" }
numera-command = { path = "crates/command" }

# 上游依赖
numr-core = { git = "https://github.com/nasedkinpv/numr", branch = "master" }

# 基础依赖
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 加密
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
argon2 = "0.6.0"
rand = "0.10.2"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Navigator", "ServiceWorkerContainer",
    "CacheStorage", "Cache", "Request", "Response",
    "IdbFactory", "IdbDatabase", "IdbTransaction", "IdbObjectStore",
    "IdbRequest", "IdbOpenDbRequest",
] }

# FFI
uniffi = "0.32.0"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.26"
crossterm = "0.27"

# 本地开发 numr-core 时使用 patch（取消注释以使用本地路径）
# [patch."https://github.com/nasedkinpv/numr"]
# numr-core = { path = "../numr/crates/numr-core" }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 3
lto = true
strip = true
