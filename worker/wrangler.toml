name = "numera-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"
MAIL_FROM = "noreply@numera.app"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "numera-db"
database_id = "xxx"  # 创建后填入

# R2 存储
[[r2_buckets]]
binding = "R2"
bucket_name = "numera-storage"

# KV 存储（会话、magic tokens）
[[kv_namespaces]]
binding = "KV"
id = "xxx"  # 创建后填入

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
